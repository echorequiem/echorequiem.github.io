<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Echo Masterworks — Echo Requiem music & free Echo Studio apps</title>
  <meta name="description" content="Echo Masterworks: classical compositions by Echo Requiem — listen and download free in FLAC, WAV, MP3 with sheet music and MIDI — and free Echo Studio apps such as Eqo Partitura, the sheet-music animation maker.">
  <link rel="canonical" href="https://echorequiem.github.io/">
  <!-- paylaşım kartı (WhatsApp, Discord, X …) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Echo Masterworks">
  <meta property="og:title" content="Echo Masterworks">
  <meta property="og:description" content="Echo Requiem: free sheet music, FLAC & WAV downloads. Echo Studio: free music apps.">
  <meta property="og:url" content="https://echorequiem.github.io/">
  <meta property="og:image" content="https://echorequiem.github.io/assets/paylasim.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="sitemap" type="application/xml" href="/sitemap.xml">
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebSite","name":"Echo Masterworks","url":"https://echorequiem.github.io/","inLanguage":["en","tr","de","fr","es","it","pt","pl","ru","ja","zh","ko"]},{"@type":"Organization","name":"Echo Masterworks","url":"https://echorequiem.github.io/","logo":"https://echorequiem.github.io/assets/paylasim.jpg","sameAs":["https://open.spotify.com/artist/1RKHAJuPPU7GUhiq7euR1i","https://imslp.org/wiki/User:Echo_Requiem","https://github.com/echorequiem"]}]}</script>
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/Montserrat.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // seçili tema sayfa çizilmeden önce uygulanır (yanıp sönme olmaz)
    try { document.documentElement.dataset.theme = localStorage.getItem("echo-theme") || "dark"; }
    catch (e) { document.documentElement.dataset.theme = "dark"; }
  </script>
</head>
<body class="loading">
  <noscript>
    <nav style="max-width:900px;margin:120px auto;padding:0 20px;font-family:serif;line-height:1.8;color:#ededee">
      <h1>Echo Masterworks</h1>
      <p><a href="/requiem/" style="color:#48FCFC">Echo Requiem</a> — classical compositions: listen, download FLAC / WAV / MP3, sheet music and MIDI for free.</p>
      <p><a href="/studio/" style="color:#9A15EE">Echo Studio</a> — free music apps: <a href="/studio/eqo-partitura/" style="color:#ededee">Eqo Partitura</a> (sheet-music animation videos from MusicXML).</p>
    </nav>
  </noscript>

  <!-- yörünge sayfasının tüm su katmanları tek kapta: sayfa geçişinde tek parça kayar -->
  <div class="surface" aria-hidden="true">
    <!-- su ortamı: halkalar ve kayalar tek bir tuvale bir kez çizilir -->
    <div class="water" id="water">
      <canvas id="waterCanvas"></canvas>
    </div>
    <div class="meniscus"></div>
    <div class="accent" id="accentBlob"></div>
    <div id="ambience" class="ambience"></div>
    <div id="ripples" class="ripples"></div>
  </div>
  <!-- güncellemeler sayfasının kendi arka planı: suyun altı (sabit, hiç hesaplanmaz) -->
  <div class="deep-bg" aria-hidden="true"><span class="rays"></span></div>

  <header class="topbar glass" data-bracket>
    <span class="hl hl-t" aria-hidden="true"></span>
    <span class="hl hl-b" aria-hidden="true"></span>
    <a class="brand" href="#/">Echo Masterworks</a>
    <nav>
      <a href="#/" data-t="eco">Ekosistem</a>
      <a href="#/guncellemeler" data-t="upd">Güncellemeler</a>
      <a href="#/requiem" data-t="about">Hakkında</a>
      <!-- İletişim: gerçek e-posta adresi belli olunca aç
      <a href="mailto:ADRES">İletişim</a> -->
      <div class="themes" role="radiogroup" aria-label="Tema">
        <button data-set-theme="light" role="radio" aria-label="Aydınlık tema" title="Aydınlık"></button>
        <button data-set-theme="blue" role="radio" aria-label="Mavi tema" title="Mavi"></button>
        <button data-set-theme="dark" role="radio" aria-label="Karanlık tema" title="Karanlık"></button>
      </div>
      <button class="sound" id="soundBtn" aria-pressed="true" aria-label="Sesi kapat" title="Ses">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2.5 6v4h2.5l3.5 3V3L5 6z" />
          <path class="wave" d="M10.8 5.6a3.4 3.4 0 0 1 0 4.8M12.6 3.8a6 6 0 0 1 0 8.4" />
          <path class="x" d="M11 6l3 4M14 6l-3 4" />
        </svg>
      </button>
    </nav>
  </header>

  <div class="views">
    <!-- ================= ANA EKRAN ================= -->
    <section class="view view-home" id="homeView">
      <main id="stage" class="stage">
        <svg id="leader" class="leader" aria-hidden="true">
          <path id="leaderPath" pathLength="1" d=""></path>
          <circle id="leadStart" r="4" cx="-20" cy="-20"></circle>
          <circle id="leadEnd" r="3.2" cx="-20" cy="-20"></circle>
        </svg>

        <div id="core" class="core">
          <img src="assets/brand/echo-masterworks-amblem.svg" alt="Echo Masterworks">
        </div>

        <div id="orbit" class="orbit"></div>

        <p class="hint" id="hint">
          <svg class="mouse" viewBox="0 0 16 24" aria-hidden="true">
            <rect x="1" y="1" width="14" height="22" rx="7" />
            <circle class="wheel" cx="8" cy="7" r="1.6" />
          </svg>
          <span data-t="hint">Aşağı kaydır:<br>son güncellemeler</span>
          <a class="hint-link" href="#/guncellemeler" aria-label="Son güncellemeler"></a>
        </p>
      </main>

      <aside id="panel" class="panel glass" data-bracket aria-hidden="true" aria-live="polite">
        <div class="panel-head">
          <button id="pClose" class="close" aria-label="Kapat">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" /></svg>
          </button>
        </div>
        <div class="tile">
          <img class="tile-logo" id="pLogo" src="" alt="">
        </div>
        <a id="pGo" class="title-row" href="#/">
          <div>
            <h2 id="pName"></h2>
          </div>
          <span class="arrow" aria-label="Detayları gör">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" /></svg>
          </span>
        </a>
        <p class="desc" id="pDesc"></p>
        <div class="chips" id="pChips"></div>
      </aside>
    </section>

    <!-- ================= SON GÜNCELLEMELER (aşağı kaydırınca alttan gelir) ================= -->
    <section class="view view-updates" id="updatesView" aria-hidden="true">
      <!-- sol üstte geri düğmesi (diğer sayfalardaki gibi) -->
      <a class="back upd-back" href="#/" data-bracket>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6M11 6l-6 6 6 6" /></svg>
        <span data-t="back">Geri</span>
      </a>
      <div class="upd-scroll" id="updScroll">
        <section class="updates" id="updates" aria-labelledby="updTitle">
          <header class="upd-head">
            <h2 id="updTitle" data-t="updTitle">Son Güncellemeler</h2>
          </header>
          <div class="upd-grid" id="updGrid"></div>
          <p class="upd-end" data-t="updEnd">Hepsi bu kadar — yukarı kaydırıp yörüngeye dönebilirsin.</p>
        </section>
      </div>
    </section>

    <!-- ================= DETAY (sağdan kayarak gelir) ================= -->
    <section class="view view-detail" id="detailView" aria-hidden="true">
      <div class="detail-wrap">
        <a class="back" href="#/" data-bracket>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6M11 6l-6 6 6 6" /></svg>
          <span id="backText">Yörüngeye dön</span>
        </a>

        <div class="detail-inner" id="detailInner">
          <section class="hero">
            <div class="hero-drop">
              <img id="dLogo" src="" alt="">
            </div>
            <div class="hero-text">
              <span class="label" id="dCode"></span>
              <h1 id="dName"></h1>
              <p class="tagline" id="dTagline"></p>
              <p class="desc" id="dDesc"></p>
              <div class="chips" id="dMeta"></div>
            </div>
          </section>
          <section class="features" id="dFeatures"></section>
          <div class="extra" id="dExtra"></div>
        </div>

        <nav class="pager">
          <a id="dPrev" class="glass" href="#/"></a>
          <a id="dNext" class="glass" href="#/"></a>
        </nav>
      </div>
    </section>
  </div>

  <script src="js/apps.js"></script>
  <script src="js/updates.js"></script>
  <script src="js/water.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/dil.js"></script>
  <script src="js/eserler.js"></script>
  <script src="js/requiem.js"></script>
  <script src="js/uygulamalar.js"></script>
  <script src="js/uygulama-raf.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
